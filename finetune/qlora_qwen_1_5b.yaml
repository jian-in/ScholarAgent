# LLaMA-Factory QLoRA config for RTX 4060 8GB
# Train: llamafactory-cli train finetune/qlora_qwen_1_5b.yaml
# NOTE: register finetune/data/scholar_sft.json in LLaMA-Factory's
#       data/dataset_info.json as "scholar_sft" (alpaca format) first.

### model
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
quantization_bit: 4          # QLoRA: 4bit base + LoRA adapters

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

### dataset
dataset: scholar_sft
dataset_dir: LLaMA-Factory/data   # relative to project root (run from E:\BiShe root)
template: qwen
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 1

### output
output_dir: finetune/output/qwen2.5-1.5b-scholar
logging_steps: 5
save_steps: 100
plot_loss: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8   # effective batch size 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true     # trade compute for VRAM on 8GB card
