name: CI

on:
  push:
    branches: [main, "contest/**"]
  pull_request:

jobs:
  # requirements.txt remains the minimal source-run path; CI also exercises the package metadata.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build
      - name: Install wheel in a clean virtual environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/scholaragent-wheel-venv"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/scholaragent-wheel-venv/Scripts/python" -m pip install dist/*.whl
            "$RUNNER_TEMP/scholaragent-wheel-venv/Scripts/scholaragent" --demo
          else
            "$RUNNER_TEMP/scholaragent-wheel-venv/bin/python" -m pip install dist/*.whl
            "$RUNNER_TEMP/scholaragent-wheel-venv/bin/scholaragent" --demo
          fi
